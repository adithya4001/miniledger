services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger_local
      POSTGRES_DB: miniledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  ledger_data:
